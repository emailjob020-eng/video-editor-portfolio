<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>temevisuals — Video Editor Portfolio</title>
  <meta name="description" content="Video editing portfolio — short-form, long-form, and brand video work." />

  <!-- Favicon (a plain SVG frame-corner mark, swap the file in /assets whenever you like) -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Google Fonts: Fraunces for big display headlines, IBM Plex Sans for everything else -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============================================= -->
  <!-- NAV — sticky top bar -->
  <!-- ============================================= -->
  <header class="nav" id="nav">
    <a href="#home" class="nav__logo">temevisuals<span class="nav__logo-dot">.</span></a>

    <div class="nav__right">
      <nav class="nav__links" id="navLinks">
        <a href="#work">Work</a>
        <a href="#shorts">Shorts</a>
        <a href="#contact">Contacts</a>
      </nav>
      <span class="nav__divider" aria-hidden="true"></span>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode" aria-pressed="false">
        <span class="theme-toggle__icon" aria-hidden="true">☼</span>
      </button>
      <button class="nav__toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>

    <!-- ============================================= -->
    <!-- HERO -->
    <!-- ============================================= -->
    <section class="hero" id="home">
      <div class="hero__text">
        <p class="hero__kicker">Video Editor — Based in [Your City]</p>
        <h1 class="hero__title">
          I cut raw footage<br />into stories<br />people finish watching.
        </h1>
        <p class="hero__sub">
        </p>
        <div class="hero__actions">
          <a href="#work" class="btn btn--primary">Watch the reel</a>
          <a href="#contact" class="btn btn--ghost">Start a project</a>
        </div>
      </div>

      <div class="hero__scene hero__intro-video">
        <video id="introVideo" preload="metadata" playsinline poster="assets/img/project-1.jpg.png">
          <source src="Video/project-1.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
        <button class="hero__video-play" id="introVideoPlay" type="button" aria-label="Play introduction video">▶</button>
      </div>
    </section>

    <!-- ============================================= -->
    <!-- WORK / BIN — list of projects styled like an
         editing software "project bin" -->
    <!-- ============================================= -->
    <section class="section work-section" id="work">
      <div class="section__head">
        <h2 class="section__title">Long form</h2>
      </div>

      <div class="bin" id="bin">
        <!-- Rows are generated by js/main.js from the PROJECTS array,
             so you only ever have to edit the list, not this HTML. -->
      </div>
    </section>

    <!-- ============================================= -->
    <!-- SHORTS — uploaded short-form videos -->
    <!-- ============================================= -->
    <section class="section shorts-section" id="shorts">
      <div class="section__head">
        <h2 class="section__title">Short form</h2>
      </div>

      <div class="shorts-grid" id="shortsGrid"></div>
    </section>


    <!-- ============================================= -->
    <!-- CONTACT -->
    <!-- ============================================= -->
    <section class="section contact" id="contact">
      <div class="contact__intro">
        <h2 class="contact__title">Let's cut<br />something great.</h2>
      </div>

      <div class="contact__actions">
        <div class="contact__email-block">
          <a class="contact__email" href="mailto:you@example.com">Let's talk</a>
        </div>

        <div class="contact__social-block">
          <div class="contact__social">
            <a href="https://youtube.com/@yourhandle" target="_blank" rel="noopener" aria-label="YouTube" title="YouTube">
              <img src="https://cdn.simpleicons.org/youtube/ffffff" alt="" />
            </a>
            <a href="https://instagram.com/yourhandle" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram">
              <img src="https://cdn.simpleicons.org/instagram/ffffff" alt="" />
            </a>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <span>temevisuals<span class="nav__logo-dot">.</span></span>
    <span>© <span id="year"></span> All rights reserved.</span>
  </footer>

  <!-- ============================================= -->
  <!-- VIDEO MODAL — one shared modal, filled in by JS
       whenever a bin row is clicked -->
  <!-- ============================================= -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" id="modalBackdrop"></div>
    <div class="modal__box" role="dialog" aria-modal="true" aria-label="Video player">
      <button class="modal__close" id="modalClose" aria-label="Close video">×</button>
      <div class="modal__frame">
        <iframe id="modalIframe"
          src=""
          title="Video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
